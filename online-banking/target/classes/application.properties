server.port=8080

# --- Default: file-based H2 SQL database (no setup needed) ---
spring.datasource.url=jdbc:h2:file:./data/keelbank;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# --- To use MySQL instead, comment the 3 lines above and uncomment these ---
# spring.datasource.url=jdbc:mysql://localhost:3306/keelbank?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=your_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
